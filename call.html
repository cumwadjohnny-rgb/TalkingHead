<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Video Call</title>
  <script>
    const base = atob("aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L25wbS90aHJlZUAwLjE3MC4wLw==");
    const im = document.createElement("script");
    im.type = "importmap";
    im.textContent = JSON.stringify({
      imports: {
        "three": base + "build/three.module.js",
        "three/addons/": base + "examples/jsm/",
        "talkinghead": "./modules/talkinghead.mjs"
      }
    });
    document.head.appendChild(im);
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    html, body { background: #0f0f13; color: #fff; height: 100%; overflow: hidden; }
    #avatar { width: 100%; height: 100%; position: fixed; inset: 0; }
    #pip-wrap {
      position: fixed; top: 16px; right: 16px; width: 105px; height: 140px;
      border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.25);
      background: #1c1c24; display: none; z-index: 10;
    }
    #user-cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #status {
      position: fixed; top: 16px; left: 16px; right: 132px; z-index: 10;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4;
      max-height: 32vh; overflow-y: auto;
    }
    #bottom-dock {
      position: fixed; bottom: 18px; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; gap: 10px; padding: 0 14px;
    }
    #chat-row { display: flex; gap: 8px; width: 100%; max-width: 520px; margin: 0 auto; }
    #chatInput {
      flex: 1; padding: 12px 16px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(20,20,28,0.88); backdrop-filter: blur(10px);
      color: #fff; font-size: 16px; outline: none;
    }
    #controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 50px; padding: 11px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.18);
      color: #fff; backdrop-filter: blur(10px);
    }
    button.active { background: #22c55e; color: #000; }
    button.warn { background: #ef4444; }
    #setup {
      position: fixed; inset: 0; z-index: 20; background: rgba(15,15,19,0.96);
      display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px;
    }
    #setup input, #setup textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
      background: #1c1c24; color: #fff; font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="setup">
    <h2>Start AI Video Call</h2>
    <input id="apiKey" type="password" placeholder="OpenRouter API Key (sk-or-...)" />
    <input id="model" type="text" value="qwen/qwen2.5-vl-72b-instruct:free" placeholder="Model ID" />
    <textarea id="persona" rows="3"></textarea>
    <button class="active" id="startBtn" type="button" onclick="joinCall()">Join Call</button>
  </div>

  <div id="avatar"></div>
  <div id="status">Ready</div>
  <div id="pip-wrap"><video id="user-cam" autoplay playsinline muted></video></div>
  <canvas id="snap" style="display:none;"></canvas>

  <div id="bottom-dock">
    <form id="chat-row" onsubmit="sendTypedMessage(event)">
      <input id="chatInput" type="text" placeholder="Type a message..." autocomplete="off" />
      <button class="active" type="submit">Send</button>
    </form>
    <div id="controls">
      <button id="micBtn" type="button" onclick="toggleMic()">🎙️ Talk</button>
      <button id="camBtn" type="button" onclick="toggleCam()">📷 Cam</button>
      <button id="muteBtn" class="active" type="button" onclick="toggleVoice()">🔊 Voice</button>
      <button id="autoBtn" class="active" type="button" onclick="toggleAuto()">🤖 Auto On</button>
      <button class="warn" id="cfgBtn" type="button" onclick="openSetup()">⚙️</button>
    </div>
  </div>

  <script src="./call.js?v=2"></script>
</body>
</html>
