<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Video Call</title>
  <script>
    const base = atob("aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L25wbS90aHJlZUAwLjE3MC4wLw==");
    const im = document.createElement("script");
    im.type = "importmap";
    im.textContent = JSON.stringify({
      imports: {
        "three": base + "build/three.module.js",
        "three/addons/": base + "examples/jsm/",
        "talkinghead": "./modules/talkinghead.mjs"
      }
    });
    document.head.appendChild(im);
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f0f13; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    #avatar { width: 100%; height: 100%; position: absolute; inset: 0; }
    #pip-wrap {
      position: absolute; top: 16px; right: 16px; width: 110px; height: 150px;
      border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.25);
      background: #1c1c24; display: none; z-index: 10;
    }
    #user-cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #status {
      position: absolute; top: 16px; left: 16px; right: 140px; z-index: 10;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4;
    }
    #controls {
      position: absolute; bottom: 28px; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; gap: 14px; padding: 0 16px;
    }
    button {
      border: none; border-radius: 50px; padding: 14px 20px; font-size: 15px;
      font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.18);
      color: #fff; backdrop-filter: blur(10px);
    }
    button.active { background: #22c55e; color: #000; }
    button.warn { background: #ef4444; }
    #setup {
      position: absolute; inset: 0; z-index: 20; background: rgba(15,15,19,0.96);
      display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px;
    }
    input, textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
      background: #1c1c24; color: #fff; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="setup">
    <h2>Start AI Video Call</h2>
    <input id="apiKey" type="password" placeholder="OpenRouter API Key (sk-or-...)" />
    <input id="model" type="text" value="openrouter/free" placeholder="Model ID" />
    <textarea id="persona" rows="3">You are a close, expressive companion on a live video call. Keep replies short, natural, and conversational (1 to 3 sentences). React to what you see on the user's camera when available.</textarea>
    <button class="active" id="startBtn" type="button" onclick="joinCall()">Join Call</button>
  </div>

  <div id="avatar"></div>
  <div id="status">Ready</div>
  <div id="pip-wrap"><video id="user-cam" autoplay playsinline muted></video></div>
  <canvas id="snap" style="display:none;"></canvas>

  <div id="controls">
    <button id="micBtn" type="button" onclick="toggleMic()">🎙️ Talk</button>
    <button id="camBtn" type="button" onclick="toggleCam()">📷 Camera Off</button>
    <button class="warn" id="cfgBtn" type="button" onclick="openSetup()">⚙️</button>
  </div>

  <script>
    let head = null;
    let camStream = null;
    let isListening = false;
    const chatHistory = [];
    const statusEl = document.getElementById("status");
    const setupEl = document.getElementById("setup");

    document.getElementById("apiKey").value = localStorage.getItem("or_key") || "";
    if (localStorage.getItem("or_model")) document.getElementById("model").value = localStorage.getItem("or_model");
    if (localStorage.getItem("or_persona")) document.getElementById("persona").value = localStorage.getItem("or_persona");

    function openSetup() {
      setupEl.style.display = "flex";
    }

    async function joinCall() {
      localStorage.setItem("or_key", document.getElementById("apiKey").value.trim());
      localStorage.setItem("or_model", document.getElementById("model").value.trim());
      localStorage.setItem("or_persona", document.getElementById("persona").value.trim());
      setupEl.style.display = "none";

      if (head) return;
      try {
        statusEl.textContent = "Step 1: Testing Three.js...";
        await import("three");
        statusEl.textContent = "Step 2: Testing Addons...";
        await import("three/addons/controls/OrbitControls.js");
        statusEl.textContent = "Step 3: Testing Retargeter...";
        await import("./modules/retargeter.mjs");
        statusEl.textContent = "Step 4: Testing DynamicBones...";
        await import("./modules/dynamicbones.mjs");
        statusEl.textContent = "Step 5: Loading TalkingHead...";
        const mod = await import("./modules/talkinghead.mjs");

        statusEl.textContent = "Step 6: Loading 3D avatar...";
        head = new mod.TalkingHead(document.getElementById("avatar"), {
          cameraView: "upper"
        });
        await head.showAvatar({
          url: "./avatars/brunette.glb",
          body: "F",
          avatarMood: "happy",
          lipsyncLang: "en"
        });
        statusEl.textContent = "Connected. Tap Talk to speak.";
      } catch (err) {
        statusEl.textContent = statusEl.textContent + " FAILED -> " + err.message;
      }
    }

    async function toggleCam() {
      const btn = document.getElementById("camBtn");
      const wrap = document.getElementById("pip-wrap");
      const video = document.getElementById("user-cam");
      if (!camStream) {
        try {
          camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
          video.srcObject = camStream;
          wrap.style.display = "block";
          btn.textContent = "📷 Camera On";
          btn.classList.add("active");
        } catch (e) {
          statusEl.textContent = "Camera blocked: " + e.message;
        }
      } else {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
        wrap.style.display = "none";
        btn.textContent = "📷 Camera Off";
        btn.classList.remove("active");
      }
    }

    function captureFrame() {
      if (!camStream) return null;
      const video = document.getElementById("user-cam");
      const canvas = document.getElementById("snap");
      canvas.width = 480;
      canvas.height = Math.round((video.videoHeight / video.videoWidth) * 480) || 640;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.7);
    }

    function speakReply(text) {
      statusEl.textContent = text;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.onstart = () => { if (head) head.startSpeaking(true); };
      utter.onend = () => { if (head) head.stopSpeaking(); };
      utter.onerror = () => { if (head) head.stopSpeaking(); };
      window.speechSynthesis.speak(utter);
    }

    async function sendToLLM(userText) {
      statusEl.textContent = "Thinking...";
      const key = localStorage.getItem("or_key");
      const model = localStorage.getItem("or_model") || "openrouter/free";
      const persona = localStorage.getItem("or_persona");

      const frame = captureFrame();
      const content = frame
        ? [{ type: "text", text: userText }, { type: "image_url", image_url: { url: frame } }]
        : userText;

      chatHistory.push({ role: "user", content });
      const recent = [{ role: "system", content: persona }, ...chatHistory.slice(-10)];

      try {
        const apiEndpoint = atob("aHR0cHM6Ly9vcGVucm91dGVyLmFpL2FwaS92MS9jaGF0L2NvbXBsZXRpb25z");
        const res = await fetch(apiEndpoint, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ model: model, messages: recent })
        });
        const data = await res.json();
        if (data.error) {
          statusEl.textContent = "OpenRouter Error: " + (data.error.message || JSON.stringify(data.error));
          return;
        }
        const firstChoice = data.choices && data.choices.at(0);
        const reply = firstChoice ? firstChoice.message.content : "I didn't catch that.";
        chatHistory.push({ role: "assistant", content: reply });
        speakReply(reply);
      } catch (err) {
        statusEl.textContent = "Network Error: " + err.message;
      }
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SpeechRec ? new SpeechRec() : null;
    if (rec) {
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.onresult = (e) => {
        const transcript = e.results.item(0).item(0).transcript;
        statusEl.textContent = "You: " + transcript;
        sendToLLM(transcript);
      };
      rec.onerror = (e) => {
        statusEl.textContent = "Mic Error: " + e.error;
      };
      rec.onend = () => {
        isListening = false;
        document.getElementById("micBtn").classList.remove("active");
        document.getElementById("micBtn").textContent = "🎙️ Talk";
      };
    }

    function toggleMic() {
      if (!rec) { statusEl.textContent = "Speech recognition not supported in this browser."; return; }
      if (!isListening) {
        window.speechSynthesis.cancel();
        isListening = true;
        document.getElementById("micBtn").classList.add("active");
        document.getElementById("micBtn").textContent = "🛑 Listening...";
        rec.start();
      } else {
        rec.stop();
      }
    }
  </script>
</body>
</html>
